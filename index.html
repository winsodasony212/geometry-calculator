<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Geometry Calculator</title>
    <meta
      name="description"
      content="Free online geometry calculator. Get the area, perimeter, surface area and volume of circles, rectangles, triangles, spheres, cubes, cylinders and cones."
    />
    <meta name="theme-color" content="#3182ce" />
    <meta property="og:title" content="Geometry Calculator" />
    <meta
      property="og:description"
      content="Calculate area, perimeter, surface area and volume for common 2D and 3D shapes."
    />
    <meta property="og:type" content="website" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📐</text></svg>"
    />
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="calculator-card">
      <header>
        <h1>Geometry Calculator</h1>
        <div class="toggle-container" role="group" aria-label="Shape dimension">
          <button type="button" class="toggle-btn active" id="btn-2d" aria-pressed="true">2D Shapes</button>
          <button type="button" class="toggle-btn" id="btn-3d" aria-pressed="false">3D Shapes</button>
        </div>
      </header>

      <section class="input-section">
        <div class="input-row">
          <div class="form-group">
            <label for="shape-select">Select Shape</label>
            <select id="shape-select">
              <option value="circle">Circle</option>
              <option value="rectangle">Rectangle</option>
              <option value="triangle">Triangle</option>
            </select>
          </div>
          <div class="form-group unit-group">
            <label for="unit-select">Unit</label>
            <select id="unit-select">
              <option value="mm">mm</option>
              <option value="cm" selected>cm</option>
              <option value="m">m</option>
              <option value="km">km</option>
              <option value="in">in</option>
              <option value="ft">ft</option>
              <option value="yd">yd</option>
            </select>
          </div>
        </div>

        <div id="dynamic-inputs" class="dynamic-inputs">
          <div class="form-group">
            <label for="input-radius">Radius (r)</label>
            <input
              type="number"
              id="input-radius"
              placeholder="e.g., 5"
              min="0"
              step="any"
              inputmode="decimal"
            />
          </div>
        </div>
      </section>

      <section class="results-section" aria-live="polite">
        <h2>Results</h2>

        <p class="message hidden" id="message" role="status"></p>

        <div class="result-box" id="area-container">
          <span class="result-label">Area</span>
          <span class="result-value" id="result-area">—</span>
        </div>

        <div class="result-box" id="perimeter-container">
          <span class="result-label">Circumference</span>
          <span class="result-value" id="result-perimeter">—</span>
        </div>

        <div class="result-box hidden" id="volume-container">
          <span class="result-label">Volume</span>
          <span class="result-value" id="result-volume">—</span>
        </div>

        <details class="steps hidden" id="steps" aria-live="off">
          <summary>Show formulas and steps</summary>
          <div id="steps-content"></div>
        </details>
      </section>
    </main>
  </body>
</html>
