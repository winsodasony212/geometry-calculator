<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Geometry calculator: area, perimeter, surface area and volume for 18 shapes, with worked formulas and unit conversion." />
    <meta name="color-scheme" content="light dark" />
    <title>Geometry Calculator</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%93%90%3C/text%3E%3C/svg%3E" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="card">
      <header>
        <h1>Geometry Calculator</h1>
        <div class="toggle" role="group" aria-label="Shape type">
          <button type="button" id="btn-2d" class="active" aria-pressed="true">2D Shapes</button>
          <button type="button" id="btn-3d" aria-pressed="false">3D Shapes</button>
        </div>
      </header>

      <form id="form" novalidate>
        <div class="field">
          <label for="shape">Shape</label>
          <select id="shape"></select>
        </div>
        <figure id="diagram" class="diagram"></figure>
        <div class="row">
          <div class="field"><label for="unit-in">Input unit</label><select id="unit-in"></select></div>
          <div class="field"><label for="unit-out">Result unit</label><select id="unit-out"></select></div>
        </div>
        <div id="inputs"></div>
      </form>

      <section class="results-section" aria-labelledby="results-title">
        <h2 id="results-title">Results</h2>
        <p id="message" class="message" role="alert" hidden></p>
        <dl id="results" aria-live="polite"></dl>
        <details id="steps" hidden>
          <summary>Show formulas and steps</summary>
          <div id="steps-content"></div>
        </details>
        <button type="button" id="copy" class="copy" hidden>Copy results</button>
      </section>
    </main>
    <noscript><p class="message">This calculator needs JavaScript to run.</p></noscript>
    <script src="shapes.js"></script>
    <script src="diagrams.js"></script>
    <script src="app.js"></script>
  </body>
</html>
